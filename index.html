<html lang="ko">
<head>

<style>
:root{--bg:#0b1620;--bg2:#10222f;--bg3:#16303f;--cd:rgba(255,255,255,.05);--cd2:rgba(255,255,255,.1);--ln:rgba(255,255,255,.1);--tx:#eef6fa;--tx2:#8ba5b4;--ac:#ffb454;--ac2:#ff7a45;--ok:#3fd08c;--bad:#ff5a6a;--warn:#ffb454;--blue:#4aa3ff;--nav:64px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;letter-spacing:-.01em;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--blue)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0,#1f5a73,#08151f 70%);padding:20px}
.lbox{background:var(--bg2);border:1px solid var(--ln);border-radius:22px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
.lbox h1{margin:0 0 4px;color:var(--ac);font-size:28px}.lbox p{color:var(--tx2);margin:0 0 18px}
#lerr{color:var(--bad);min-height:20px;margin:12px 0 0;font-weight:700;word-break:keep-all}
.btn{border:0;border-radius:10px;padding:9px 14px;min-height:36px;font-weight:800;background:linear-gradient(var(--ac),var(--ac2));color:#2a1200;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.g{background:var(--cd2);color:var(--tx)}.btn.r{background:var(--bad);color:#fff}.btn.k{background:var(--ok);color:#06281a}.btn.s{padding:5px 10px;min-height:30px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
#app{display:flex;height:100%}
aside{width:196px;flex:none;background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:14px 10px;gap:3px;overflow:auto}
aside .brand{font-weight:900;font-size:18px;color:var(--ac);padding:4px 10px 12px}
aside button.nv{border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;color:var(--tx2);font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
aside button.nv.on{background:var(--cd2);color:var(--tx)}
aside .me{margin-top:auto;padding:10px;color:var(--tx2);font-size:12px;word-break:break-all}
main{flex:1;min-width:0;overflow:auto;padding:22px 26px 60px;-webkit-overflow-scrolling:touch}
h2{margin:0 0 14px;font-size:22px}h3{margin:16px 0 8px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.card small{color:var(--tx2);font-weight:700}.card b{display:block;font-size:24px;margin-top:2px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box>h3:first-child{margin-top:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--tx2);font-size:12px;font-weight:700}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--cd)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;background:var(--cd2);margin:1px 2px 1px 0}
.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#06281a}.tag.wn{background:var(--warn);color:#2a1200}.tag.bl{background:var(--blue);color:#021a33}
input[type=text],input[type=number],input[type=search],select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;min-height:36px;min-width:0;outline:none;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:#10222f}
textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label{color:var(--tx2);font-weight:700;min-width:64px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--cd);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.chip.on{background:var(--ok);color:#06281a;border-color:transparent}
.r0{color:#9fb3bf}.r1{color:#3fb97c}.r2{color:#4aa3ff}.r3{color:#b46bff}.r4{color:#ffb42e}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--tx2)}
.mut{color:var(--tx2)}
#modal{position:fixed;inset:0;background:rgba(2,10,16,.75);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
#mb{background:var(--bg2);border:1px solid var(--ln);border-radius:20px;width:100%;max-width:920px;position:relative;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
#mh{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#mh h2{margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mt{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;border-bottom:1px solid var(--ln)}
#mt button{border:0;background:none;color:var(--tx2);font-weight:800;padding:8px 12px;border-radius:9px;white-space:nowrap;cursor:pointer}
#mt button.on{background:var(--cd2);color:var(--tx)}
#mc{padding:14px 16px 26px;overflow:auto;-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:#08151f;border:1px solid var(--ln);padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.err{border-color:var(--bad);color:#ffb0b8}
.warn{border:1px solid rgba(255,90,106,.5);background:rgba(255,90,106,.08);border-radius:12px;padding:10px 12px;color:#ffc2c8;margin:8px 0}
.info{border:1px solid rgba(74,163,255,.4);background:rgba(74,163,255,.08);border-radius:12px;padding:10px 12px;margin:8px 0}
.scroll{max-height:380px;overflow:auto}
.sevb{display:inline-block;min-width:54px;text-align:center;padding:1px 8px;border-radius:8px;font-size:11px;font-weight:900}
.s3{background:var(--bad);color:#fff}.s2{background:#ff8a3a;color:#2a1200}.s1{background:var(--warn);color:#2a1200}.s0{background:var(--cd2);color:var(--tx2)}
.fd{padding:8px 0;border-bottom:1px dashed var(--ln)}.fd:last-child{border:0}
.fd b{display:block;margin:2px 0}.fd .ev{color:var(--tx2);font-size:13px;word-break:keep-all;white-space:pre-wrap}
details.ac{border:1px solid var(--ln);border-radius:12px;margin:8px 0;background:var(--cd)}
details.ac>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.ac>summary::-webkit-details-marker{display:none}
details.ac .bd{padding:0 12px 10px}
.tog{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--cd)}
.tog.on{border-color:var(--bad);background:rgba(255,90,106,.1)}
.sw{position:relative;width:50px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#456;transition:.2s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--bad)}.sw input:checked+i:after{left:25px}
canvas#omap{width:100%;max-width:420px;aspect-ratio:1;background:#0a1c2a;border:1px solid var(--ln);border-radius:14px}
.bar{position:sticky;bottom:0;background:var(--bg2);padding:10px 0 2px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:10px}
#bnav{display:none}
#more{position:fixed;inset:0;z-index:70;background:rgba(2,10,16,.6);display:flex;align-items:flex-end}
#more>div{background:var(--bg2);width:100%;border-radius:20px 20px 0 0;padding:14px 14px calc(var(--sb) + 16px);display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#more button{border:1px solid var(--ln);background:var(--cd);border-radius:12px;padding:14px;font-weight:800;color:var(--tx)}
@media(max-width:820px){
 #app{flex-direction:column}
 aside{display:none}
 main{padding:14px 12px calc(var(--nav) + var(--sb) + 24px)}
 h2{font-size:19px}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:var(--bg2);border-top:1px solid var(--ln);z-index:40}
 #bnav button{flex:1;border:0;background:none;color:var(--tx2);font-weight:800;font-size:12px;position:relative}
 #bnav button.on{color:var(--ac)}
 #bnav b{position:absolute;top:8px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
 input[type=text],input[type=number],input[type=search],select,textarea{font-size:16px}
 .btn{min-height:42px}.btn.s{min-height:36px}
 #modal{padding:0}#mb{max-width:none;border-radius:0;max-height:none;min-height:100%;border:0}
 #mh{position:sticky;top:0;background:var(--bg2);z-index:2;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 #mt{position:sticky;top:56px;background:var(--bg2);z-index:2}
 table.rt,table.rt tbody{display:block}
 table.rt tr.h{display:none}
 table.rt tr{display:block;border:1px solid var(--ln);border-radius:12px;margin:8px 0;padding:6px 10px;background:var(--cd)}
 table.rt td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 0;text-align:right;word-break:break-all}
 table.rt td[data-l]:before{content:attr(data-l);color:var(--tx2);font-weight:700;text-align:left;flex:none}
 table.rt td.act{justify-content:flex-end;flex-wrap:wrap;gap:6px}
 table.rt td.act:before{display:none}
 .row>label{min-width:100%}
 .scroll{max-height:none}
}
/* ===== v3 UI ===== */
:root{--r:16px}
body{-webkit-font-smoothing:antialiased}
.btn{transition:transform .08s,filter .15s,background .15s}.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{width:216px;padding:16px 10px}
aside .brand{font-size:19px;padding:4px 10px 14px;letter-spacing:-.02em}
aside button.nv{gap:10px;justify-content:flex-start;font-size:14px;transition:background .15s}
aside button.nv:hover{background:var(--cd)}
aside button.nv.on{background:linear-gradient(90deg,rgba(255,180,84,.22),rgba(255,180,84,.05));color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.nv .ic{width:22px;text-align:center;font-size:16px}.nv .l{flex:1}
main{padding:24px 28px 80px;max-width:1180px}
h2{font-size:23px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:15px}
.box{border-radius:var(--r);padding:16px 18px}
.card{transition:transform .15s,background .15s}.card:hover{background:var(--cd2)}
.hint{color:var(--tx2);font-size:12px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 14px}
.qa button{border:1px solid var(--ln);background:var(--cd);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;cursor:pointer;color:var(--tx);transition:transform .1s,background .15s}
.qa button:hover{background:var(--cd2)}.qa button:active{transform:scale(.97)}
.qa .ic{font-size:26px;line-height:1}
#bnav button .ic{display:block;font-size:20px;line-height:1.15}
#bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.okb{border:1px solid rgba(63,208,140,.45);background:rgba(63,208,140,.09);border-radius:12px;padding:9px 12px;margin:8px 0;color:#bff0d9;font-size:13px}
.chip{transition:background .12s,transform .08s}.chip:active{transform:scale(.96)}
.chip.on{box-shadow:0 0 0 2px rgba(63,208,140,.25)}
.empty{text-align:center;padding:28px 10px;color:var(--tx2)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
#busy{position:fixed;left:0;top:0;height:3px;width:0;opacity:0;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:200;transition:width .6s,opacity .25s;pointer-events:none}
#toast{z-index:300}
#dlg{position:fixed;inset:0;z-index:150;background:rgba(2,10,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#dlgb{background:var(--bg2);border:1px solid var(--ln);border-radius:20px;padding:20px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dlgb h3{margin:0 0 8px;font-size:17px}
#dlgb .dm{white-space:pre-wrap;color:var(--tx);margin-bottom:10px;word-break:keep-all}
#dlgb input{width:100%}
.prog{height:12px;background:var(--cd2);border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#7be8b4);transition:width .2s}
.step{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.step b{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#2a1200;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.gvsl{margin:8px 0}.gvh{font-weight:800;color:var(--tx2);font-size:12px;margin:6px 0 4px;display:flex;gap:8px;align-items:center}
.sumbox{border:1px dashed var(--ac);border-radius:14px;padding:12px 14px;background:rgba(255,180,84,.07)}
.sumbox li{margin:2px 0}
.stick{position:sticky;bottom:calc(var(--nav) + var(--sb) + 8px);z-index:5}
@media(min-width:821px){.stick{bottom:8px}}
@media(max-width:820px){
 #dlg{align-items:flex-end;padding:0}#dlgb{border-radius:20px 20px 0 0;max-width:none;padding-bottom:calc(20px + var(--sb))}
 main{padding:14px 12px calc(var(--nav) + var(--sb) + 24px)}
 .box{padding:13px 13px}
 .btn{min-height:44px}.btn.s{min-height:38px}
 .qa{grid-template-columns:repeat(3,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* 크리스마스 토큰으로 낼 수 있는 룰렛 횟수 상한 (토큰 = 낚시 드롭 + 퀘스트 + 보물 + 골드로 구매) */

/* analyze: u={save,meta}, ctx={now,cfg,live} -> {findings,score,cats} */

  /* 2. 스탯(gear) 조작 — 버프(이속·입질·파워 ×, 행운·골드 +)를 쓴 이력이 있으면 그 스탯은 버프 포함 값까지 허용 */

  const STATCAT={speed:'speed',bite:'bite',luck:'luck',power:'power',zone:'zone',swim:'speed',sprint:'speed',lc:'stat',twin:'twin',gold:'gold',big:'stat',guard:'stat',coop:'stat',grap:'speed'};
  const STATN={speed:'이동속도',bite:'입질속도',luck:'행운',power:'릴 파워',zone:'판정 범위',swim:'수영',sprint:'질주',lc:'투척거리',twin:'쌍걸이',gold:'골드 보너스',big:'대물',guard:'리듬 보호',coop:'동료 시너지',grap:'그랩'};

    const un=Object.keys(sg).filter(k=>!(k in exp));
    if(un.length)add(3,'stat','gear_unknown','게임에 없는 스탯 키가 들어 있어요',un.map(k=>'gear.'+k+' = '+JSON.stringify(sg[k])));
    for(const k of Object.keys(exp)){
      if(sg[k]===undefined)continue;const v=sg[k],e=expB[k];
      if(!isNum(v)){add(3,'stat','gear_nan_'+k,'스탯 '+k+' 값 이상','gear.'+k+' = '+JSON.stringify(v));continue}
      const base=(k==='speed'||k==='power'||k==='bite'||k==='swim')?1:0;
      if(v>e+.0006){
        const over=GMAXB[k]!==undefined&&v>GMAXB[k]+.0006;

        add(over?3:2,STATCAT[k]||'stat','gear_'+k,STATN[k]+' 스탯이 장착 장비로 낼 수 있는 값보다 높아요'+(over?' (전체 최대치도 초과)':''),

  if(m.wbad>=2)monFlag(uid,m,'bite',m.wbad>=5?3:2,'bite','입질 대기 시간이 장비로 낼 수 있는 최소값보다 짧아요',['입질까지 최소 '+m.wmin.toFixed(2)+'초 / 정상 최소 약 '+m.lmin.toFixed(2)+'초 (입질 스탯 '+fmt(g.bite)+', 동료 효과 최대 반영)','짧은 대기 '+m.wbad+'회 / 측정 '+m.waits+'회']);
  if(m.cbad>=3)monFlag(uid,m,'rate',m.cbad>=8?3:2,'time','포획 간격이 물리적 최소보다 짧아요',['최단 포획 간격 '+m.civ.toFixed(1)+'초 (게임상 최소 약 6초)','짧은 간격 '+m.cbad+'회 / 측정 '+m.cn+'회']);
  const nb=m.rar.reduce((a,b)=>a+b,0);
  if(nb>=30){const Lmax=GMAXB.luck+2*(.08+GMAX.coop*.8)+ccfg().luck,pr=rarProbs(Lmax),k=m.rar[3]+m.rar[4],pv=binTail(k,nb,pr[3]+pr[4]);
    if(pv<1e-6)monFlag(uid,m,'luck',pv<1e-10?3:2,'luck','감시 중 희귀도 분포가 정상 최대 행운으로도 설명이 안 돼요',['감시 중 '+nb+'마리 중 영웅+전설 '+k+'마리 (기대 '+(nb*(pr[3]+pr[4])).toFixed(1)+')','우연일 확률 '+pv.toExponential(1)])}
}

function sledLook(uid,m){const t=nowT();if(m.slT&&t-m.slT<10*60e3)return;m.slT=t;

function normSave(s){

  o.codex=o.codex||{};o.items=o.items||{};o.equip=Object.assign(EQ0(),o.equip||{});
  o.pity=Object.assign({rod:0,shoes:0,hat:0,pet:0},o.pity||{});o.ptl=Array.isArray(o.ptl)?o.ptl:Object.values(o.ptl||{});
  o.settings=Object.assign({},SET0,o.settings||{});o.gear=o.gear||gearOf(o);
  o.att=o.att&&typeof o.att==='object'?o.att:{last:-1,streak:0,total:0};o.tr=+o.tr||0;o.trc=Array.isArray(o.trc)?o.trc:[];o.xt=+o.xt||0;o.sf=+o.sf||0;o.sled=o.sled?1:0;
  o.avatar=+o.avatar||0;o.tut=+o.tut||0;o.nick=o.nick||'';return o}

   <div class="row"><label>장비</label><select id="gvItem" style="flex:1;min-width:160px"><option value="sled">🛷 썰매</option>${its.map(i=>h`<option value="${i.id}">${SLOTN[i.slot]} · [${RN[i.ri]}] ${i.n}${i.xm?' 🎄':''}${U&&U.save.items[i.id]?' (보유)':''}</option>`)}</select><button class="btn g s" data-a="giveItem">지급</button></div></div>`}

  const a=s.att||{},now=nowT(),qs=s.qs&&typeof s.qs==='object'?s.qs:null,bf=s.bf&&typeof s.bf==='object'?s.bf:{},trH=Array.isArray(s.trH)?s.trH:(s.trH?Object.values(s.trH):[]);
  const act=Object.keys(BUFFN).filter(k=>+bf[k]>now);
  return h`<div class="box"><h3>출석 · 퀘스트 · 보물 · 버프</h3>
   <div class="grid2"><div class="row"><label>출석</label><span class="mono">총 ${+a.total||0}회 · 연속 ${+a.streak||0}일 · 마지막 ${a.lastT?fmtT(a.lastT):'-'}</span></div>
   <div class="row"><label>시간제 퀘스트</label><span class="mono">${qs&&qs.h?fmtT(qs.h*3600e3)+' 정각 · 완료 '+(qs.c||[]).filter(Boolean).length+'/3'+(qs.b?' · 보너스 수령':''):'기록 없음'}</span></div>
   <div class="row"><label>썰매</label><span class="mono">${s.sled?'보유':'없음'}${s.equip&&s.equip.ride==='sled'?' · 장착':''}</span></div>
   <div class="row"><label>버프</label><span class="mono">${act.length?act.map(k=>BUFFN[k]+' ('+Math.ceil((+bf[k]-now)/60000)+'분 남음)').join(', '):'없음'}</span></div></div>
   ${trH.length?h`<details><summary class="mut" style="cursor:pointer">최근 보물 결과 ${trH.length}건</summary><div class="scroll" style="max-height:200px">${trH.map(x=>h`<div class="fd"><span class="mono">${fmtT(x&&x.t)}</span> ${x&&x.ok?'':'꽝 · '}${(x&&x.m)||''}</div>`)}</div></details>`:''}</div>`}

   ${an.level>=1?h`<div class="warn"><b>${SEV[an.level]}</b> — ${catTags(an.cats)} <a href="#" data-a="ut" data-id="an">분석 보기</a></div>`:h`<div class="info">현재 분석에서 눈에 띄는 이상 징후는 없어요.</div>`}

   <div class="box"><h3>한 번에 처리</h3><div class="row"><button class="btn r" data-a="seizeAll">전체 압수 (골드·소지품·장비·토큰)</button><button class="btn g" data-a="seizeBan">압수 + 밴</button></div></div>`;

   <div class="row"><button class="btn g" data-a="budget">시간 예산 늘리기</button><span class="mono">저장이 거부되는 유저(오프라인 선플레이 등)에게 써요</span></div>
   <div class="row"><button class="btn r" data-a="uReset">세이브 초기화</button><button class="btn r" data-a="uWipe">모든 데이터 삭제</button></div></div>`;
  else body=h`<div class="box"><h3>세이브 원본 JSON</h3><textarea id="uRaw" spellcheck="false">${JSON.stringify(s,null,2)}</textarea><div class="row"><button class="btn k" data-a="uRawSave">JSON 적용</button></div></div>`;
  put(mc,h`${head}${body}`)}
function invView(){
  const s=U.save,inv=s.inv,an=U.an,badSet=badInv(s);
  const flt=U.invF,rows=inv.map((it,i)=>({it,i,f:FB[it.id],bad:badSet.has(i)})).filter(r=>flt==='all'||(flt==='bad'&&r.bad)||(flt==='r'+(r.f?r.f.ri:-1)));

   <div class="box"><h3>물고기 지급</h3><div class="row"><select id="fAddId">${Object.values(FB).map(f=>h`<option value="${f.id}">[${RN[f.ri]}] ${f.n}</option>`)}</select><input type="number" id="fAddN" min="1" max="200" value="1" style="width:72px"><button class="btn g s" data-a="fAdd">지급</button></div><div class="mono">지급하면 도감 기록도 같이 늘려서 분석에 걸리지 않게 해요.</div></div>
   <div class="box"><h3>도감</h3><div class="row"><span class="mono">${Object.keys(s.codex).length}/${Object.keys(FB).length}</span><button class="btn g s" data-a="cxAll">전부 해금</button><button class="btn r s" data-a="cxClear">도감 초기화</button></div></div>`}
function badInv(s){
  const bad=new Set(),cfg=S.cfg,fm=Math.max(1,...Object.values(cfg.fish||{}).map(Number)),PB={hi:Math.max(1,(+cfg.price||1)*fm),lo:1},cnt={};
  s.inv.forEach((it,i)=>{const f=FB[it.id];if(!f){bad.add(i);return}
    if(it.size>f.max*1.3+.3||it.size<f.min*.8-.3){bad.add(i);return}
    const [lo,hi]=priceBand(f,+it.size,PB);if(it.price>hi||it.price<lo){bad.add(i);return}
    cnt[it.id]=(cnt[it.id]||0)+1;const c=s.codex[it.id];if(cnt[it.id]>(c&&+c.n||0))bad.add(i)});
  return bad}

/* 저장 파이프라인
   접속 중인 유저의 게임은 자기 메모리의 세이브를 계속 서버에 덮어써요. 그래서
   ① 서버 규칙으로 그 유저의 쓰기를 잠깐 막고 ② 세이브를 쓰고 ③ 재접속시켜 새 데이터를 읽게 한 뒤 ④ 막은 걸 풀고 ⑤ 서버에서 다시 읽어 확인해요.
   (게임의 '새로고침' 이벤트는 지금 게임 코드에서 데이터를 다시 못 읽어서, 기본은 재접속 방식이에요) */
const applyMode=()=>{try{return localStorage.getItem('pd-apply')||'kick'}catch(e){return 'kick'}};
async function freezeIf(uid,force){
  if(S.bans[uid])return false;
  if(!force&&!isOnline(uid))return false;
  const r='관리자가 데이터를 수정하고 있어요. 잠시 후 다시 접속해 주세요';
  await db.ref('bans/'+uid).set({reason:r,temp:true,t:TS(),by:ADMIN});S.bans[uid]={reason:r,temp:true};
  await sleep(1500);return true}
async function thaw(uid,did){

function userBar(){const uid=U.uid,n=(U.hist||[]).length,nt=(S.notes[uid]||{}).text;return h`<div class="row"><button class="btn g s" data-x="watch">${WL()[uid]?'⭐ 관심 해제':'☆ 관심 등록'}</button><button class="btn g s" data-x="copy" data-id="${uid}">UID 복사</button><button class="btn g s" data-x="note">📝 메모</button><button class="btn g s" data-x="undo" ${n?'':'disabled'}>↩ 되돌리기${n?' ('+n+')':''}</button><button class="btn g s" data-x="dlUser">JSON 저장</button></div>${nt?h`<div class="info">📝 ${nt}</div>`:''}${U.last?h`<div class="${U.last.ok===false?'warn':'okb'}">${U.last.ok===false?'⚠ 반영 확인 실패':'✔ 서버에 반영됨'} · ${U.last.msg} · ${fmtAgo(U.last.t)}${U.last.online?' · 접속 중이라 잠깐 막고 재접속시켜 적용했어요':''}${U.last.ok===false?' · 유저가 덮어썼을 수 있어요. 다시 시도해 주세요':''}</div>`:''}`}

    .forEach(id=>palR.push({l:(Wl[id]?'⭐ ':'👤 ')+nickOf(id)+' · '+id.slice(0,8)+(isOnline(id)?' · 접속중':''),f:()=>openUser(id)}));
  TABS.filter(t=>!q||t[1].toLowerCase().includes(q)).forEach(t=>palR.push({l:'↪ '+t[1]+' 탭',f:()=>go(t[0])}));
  palI=Math.min(palI,Math.max(0,palR.length-1));put($('#pall'),h`${palR.map((r,i)=>h`<div class="pi ${i===palI?'on':''}" data-pi="${i}">${r.l}</div>`)}`)}
const palGo=i=>{const r=palR[i];if(r){palClose();r.f()}};
$('#palq').addEventListener('input',()=>{palI=0;palRender()});
$('#pall').addEventListener('click',e=>{const p=e.target.closest('[data-pi]');if(p)palGo(+p.dataset.pi)});
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')palClose()});
addEventListener('keydown',e=>{const tg=document.activeElement&&document.activeElement.tagName;
  if(!$('#pal').hidden){if(e.key==='Escape')palClose();else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palI=(palI+(e.key==='ArrowDown'?1:-1)+palR.length)%Math.max(1,palR.length);palRender()}else if(e.key==='Enter')palGo(palI);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tg))){e.preventDefault();palOpen()}
  else if(e.key==='Escape'&&!$('#modal').hidden)closeModal()},true);
document.addEventListener('click',guard(async e=>{const b=e.target.closest('[data-x]');if(!b)return;e.preventDefault();const x=b.dataset.x,id=b.dataset.id;
  switch(x){
   case 'pal':palOpen();break;
   case 'usort':uSort=id;RENDER.users();break;
   case 'umore':uLim+=200;RENDER.users();break;
   case 'stRefresh':S.stat=null;put($('#view'),h`<div class="mono">집계 중…</div>`);await RENDER.stats();break;
   case 'snd':try{localStorage.setItem('pd-snd',JSON.stringify(!LS('pd-snd',false)))}catch(e2){}RENDER.tools();beep();break;
   case 'csvUsers':{const ids=[...new Set([...Object.keys(S.profiles),...Object.keys(S.lb)])];dl('padack-users-'+stamp()+'.csv',['uid,닉네임,누적골드,도감,밴,메모'].concat(ids.map(k=>[k,nickOf(k),(S.lb[k]||{}).earned||0,(S.lb[k]||{}).dex||0,S.bans[k]?'Y':'',(S.notes[k]||{}).text||''].map(cq).join(','))).join('\n'));break}
   case 'csvScan':{const r=S.scan;if(!r)break;dl('padack-scan-'+stamp()+'.csv',['uid,닉네임,위험도,점수,적발내용'].concat(r.list.map(x=>[x.uid,nickOf(x.uid),SEV[x.level],x.score.toFixed(1),x.findings.filter(f=>f.sev>=1).map(f=>f.title).join(' | ')].map(cq).join(','))).join('\n'));break}
   case 'watch':{const w=WL();if(w[U.uid])delete w[U.uid];else w[U.uid]=1;saveWL(w);renderUser();break}
   case 'copy':try{await navigator.clipboard.writeText(id);toast('UID를 복사했어요')}catch(e2){toast('복사 실패 — 직접 선택해 복사하세요',true)}break;
   case 'note':{const cur=(S.notes[U.uid]||{}).text||'',t=await dPrompt('운영 메모 (유저에게 보이지 않아요, 비우면 삭제)',cur);if(t===null)break;
     if(t.trim()){await db.ref('adminnotes/'+U.uid).set({text:t.trim().slice(0,300),t:TS()});S.notes[U.uid]={text:t.trim().slice(0,300)}}else{await db.ref('adminnotes/'+U.uid).remove();delete S.notes[U.uid]}log('note',U.uid,t.slice(0,100));renderUser();break}
   case 'undo':{if(!U||!(U.hist||[]).length)break;if(!await dConfirm('직전 저장 상태로 되돌릴까요?'))break;const prev=U.hist.pop();U.undoing=true;try{U.save=normSave(JSON.parse(prev));await writeSave(U.uid,U.save,U.meta,'되돌리기')}finally{U.undoing=false}U.has=true;U.raw=U.save;renderUser();break}
   case 'dlUser':dl('padack-user-'+U.uid.slice(0,8)+'-'+stamp()+'.json',JSON.stringify(U.save,null,2),'application/json');break;
  }}));
if(!$('#app').hidden&&auth.currentUser)start(auth.currentUser); /* 확장이 늦게 로드된 경우 탭/메뉴 다시 그리기 */

<script>
'use strict';
/* =====================================================================
   v3: 앱 안 대화상자 · 일괄 지급 · 적용 방식 설정

/* ---------- 대화상자 (브라우저 기본 prompt/confirm 대체) ---------- */
function dlg(o){return new Promise(res=>{
  const d=document.getElementById('dlg'),b=document.getElementById('dlgb');
  put(b,h`<h3>${o.title||'확인'}</h3>${o.msg?h`<div class="dm">${o.msg}</div>`:''}${o.word?h`<div class="hint" style="margin-bottom:6px">확인을 위해 <b>${o.word}</b> 를 입력하세요</div>`:''}${(o.input||o.word)?(o.area?h`<textarea id="dlgi" style="min-height:90px">${o.def||''}</textarea>`:h`<input type="text" id="dlgi" value="${o.def||''}" placeholder="${o.ph||''}" autocomplete="off">`):''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn g" id="dlgc">취소</button><button class="btn ${o.danger?'r':''}" id="dlgo">${o.ok||'확인'}</button></div>`);
  d.hidden=false;
  const i=document.getElementById('dlgi');
  const end=v=>{d.hidden=true;document.removeEventListener('keydown',kd,true);res(v)};
  const ok=()=>{if(o.word){if(!i||i.value.trim()!==o.word){toast('"'+o.word+'" 를 정확히 입력해 주세요',true);return}end(true)}else end(i?i.value:true)};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();end(null)}else if(e.key==='Enter'&&!o.area&&!e.isComposing){e.preventDefault();ok()}};
  document.getElementById('dlgo').onclick=ok;document.getElementById('dlgc').onclick=()=>end(null);
  d.onclick=e=>{if(e.target===d)end(null)};
  document.addEventListener('keydown',kd,true);setTimeout(()=>i&&i.focus(),40)})}
const dConfirm=(m,o)=>dlg(Object.assign({title:'확인',msg:m},o||{})).then(v=>v!==null);
const dPrompt=(m,def)=>dlg({title:'입력',msg:m,input:true,def});
const typed=(w,m)=>dlg({title:'⚠ 되돌릴 수 없을 수 있어요',msg:m,word:w,danger:true,ok:'실행'}).then(v=>v===true);

/* ---------- 일괄 지급 ---------- */
const GV={tgt:'all',uids:'',skipBan:true,onl:'kick',gold:0,xt:0,sf:0,sled:false,earned:false,items:new Set(),fish:[],buffs:[],bc:'',run:false,cancel:false};
const SLN={rod:'낚싯대',shoes:'신발',hat:'머리 장식',pet:'펫'};
function gvTargets(){
  const all=[...new Set([...Object.keys(S.profiles),...Object.keys(S.lb)])];let ids;
  if(GV.tgt==='custom')ids=[...new Set(GV.uids.split(/[\s,;]+/).map(x=>x.trim()).filter(x=>x.length>=20))];
  else if(GV.tgt==='online')ids=all.filter(isOnline);else ids=all;
  if(GV.skipBan)ids=ids.filter(u=>!S.bans[u]);return ids}
function gvPlan(){const items=[...GV.items],any=GV.gold>0||GV.xt>0||GV.sf>0||GV.sled||items.length>0||GV.fish.length>0||GV.buffs.length>0;
  return {gold:GV.gold,xt:GV.xt,sf:GV.sf,sled:GV.sled,earned:GV.earned,items,fish:GV.fish,buffs:GV.buffs,bc:GV.bc.trim(),any}}
function gvLines(g){const L=[];
  if(g.gold)L.push('💰 골드 '+fmtG(g.gold)+'G'+(g.earned?' (누적 획득·랭킹에도 반영)':''));
  if(g.xt)L.push('🎫 크리스마스 토큰 '+fmtG(g.xt)+'개');
  if(g.sf)L.push('❄ 눈송이 '+fmtG(g.sf)+'개');
  if(g.sled)L.push('🛷 썰매 (이미 있으면 건너뜀)');
  if(g.items.length)L.push('🎒 장비 '+g.items.length+'개: '+g.items.map(id=>IT[id].n).slice(0,6).join(', ')+(g.items.length>6?' 외 '+(g.items.length-6)+'개':'')+' (이미 있으면 건너뜀)');
  for(const [id,n] of g.fish)L.push('🐟 '+FB[id].n+' × '+n);
  for(const [b,m] of g.buffs)L.push('✨ 버프 '+BUFFN[b]+' '+m+'분');
  return L}
function gvSum(){const el=$('#gvSum');if(!el)return;
  const ids=gvTargets(),on=ids.filter(isOnline).length,g=gvPlan(),L=gvLines(g);
  put(el,h`<div class="sumbox"><b>대상 ${ids.length.toLocaleString()}명</b> <span class="hint">(접속 중 ${on}명${on&&GV.onl==='skip'?' · 건너뜀':''})</span>${L.length?h`<ul style="margin:8px 0 0;padding-left:18px">${L.map(x=>h`<li>${x}</li>`)}</ul>`:h`<div class="hint" style="margin-top:6px">지급할 내용을 골라 주세요</div>`}${g.bc?h`<div class="hint" style="margin-top:6px">📢 공지: ${g.bc}</div>`:''}</div>`);
  const b=$('#gvGo');if(b)b.disabled=!(ids.length&&g.any)}
RENDER.give=async()=>{
  const fo=Object.values(FB).sort((a,b)=>a.ri-b.ri||a.n.localeCompare(b.n,'ko'));
  put($('#view'),h`<h2>🎁 일괄 지급</h2>
  <div class="info">골드·토큰·장비·썰매·물고기를 여러 유저에게 한 번에 보내요. <b>접속 중인 유저는 잠깐 막고 → 저장 → 재접속시켜서</b> 확실히 적용하고, 저장 뒤 서버에서 다시 읽어 확인해요.</div>
  <div class="box"><div class="step"><b>1</b><h3 style="margin:0">누구에게?</h3></div>
   <div class="chips" style="margin-bottom:8px">${[['all','전체 유저'],['online','접속 중인 유저'],['custom','UID 직접 입력']].map(([k,l])=>h`<span class="chip ${GV.tgt===k?'on':''}" data-g="tgt" data-id="${k}">${l}</span>`)}<span class="chip ${GV.skipBan?'on':''}" data-g="flag" data-id="skipBan">밴 유저 제외</span></div>
   <div id="gvCustom" ${GV.tgt==='custom'?'':'hidden'}><textarea data-gi="uids" placeholder="UID 를 줄바꿈이나 쉼표로 구분해서 붙여 넣으세요" style="min-height:90px;font-size:12px">${GV.uids}</textarea></div></div>
  <div class="box"><div class="step"><b>2</b><h3 style="margin:0">무엇을?</h3></div>
   <div class="grid2"><div class="row"><label>골드</label><input type="number" inputmode="numeric" min="0" data-gi="gold" value="${GV.gold||''}" placeholder="0"></div>
   <div class="row"><label>토큰</label><input type="number" inputmode="numeric" min="0" data-gi="xt" value="${GV.xt||''}" placeholder="0"></div>
   <div class="row"><label>눈송이</label><input type="number" inputmode="numeric" min="0" data-gi="sf" value="${GV.sf||''}" placeholder="0"></div></div>
   <div class="chips" style="margin:6px 0 10px"><span class="chip ${GV.sled?'on':''}" data-g="flag" data-id="sled">🛷 썰매</span><span class="chip ${GV.earned?'on':''}" data-g="flag" data-id="earned">골드를 누적 획득·랭킹에도 반영</span></div>
   <h3>장비 <span class="hint">눌러서 선택 · 🎄 = 룰렛 전용</span></h3>
   <div class="row"><input type="search" data-gi="q" placeholder="장비 이름 검색" style="flex:1;min-width:160px"><button class="btn g s" data-g="itemsClear">선택 해제</button><span class="mono" id="gvIc">${GV.items.size}개 선택</span></div>
   ${Object.keys(SLN).map(sl=>h`<div class="gvsl"><div class="gvh">${SLN[sl]} <a href="#" data-g="slotAll" data-id="${sl}">전부</a></div><div class="chips">${ITEMS_BY(sl).map(i=>h`<span class="chip ${GV.items.has(i.id)?'on':''}" data-g="item" data-id="${i.id}" data-n="${i.n}"><span class="r${i.ri}">●</span> ${i.n}${i.xm?' 🎄':''}</span>`)}</div></div>`)}
   <h3>물고기</h3><div class="row"><select id="gvFish" style="flex:1;min-width:160px">${fo.map(f=>h`<option value="${f.id}">[${RN[f.ri]}] ${f.n}</option>`)}</select><input type="number" id="gvFishN" min="1" max="200" value="1" style="width:76px"><button class="btn g s" data-g="fishAdd">추가</button></div>
   <div class="chips" id="gvFishL">${GV.fish.map(([id,n],i)=>h`<span class="chip on">${FB[id].n} ×${n} <a href="#" data-g="fishDel" data-id="${i}" style="color:#06281a">✕</a></span>`)}</div>
   <h3>버프 <span class="hint">접속 중인 유저에게 의미 있어요</span></h3><div class="row"><select id="gvBuf">${Object.keys(BUFFN).map(k=>h`<option value="${k}">${BUFFN[k]}</option>`)}</select><input type="number" id="gvBufM" min="1" max="120" value="10" style="width:76px"> 분<button class="btn g s" data-g="bufAdd">추가</button></div>
   <div class="chips" id="gvBufL">${GV.buffs.map(([b,m],i)=>h`<span class="chip on">${BUFFN[b]} ${m}분 <a href="#" data-g="bufDel" data-id="${i}" style="color:#06281a">✕</a></span>`)}</div></div>
  <div class="box"><div class="step"><b>3</b><h3 style="margin:0">옵션</h3></div>
   <div class="row"><label>접속 중인 유저</label><div class="chips">${[['kick','재접속시키며 지급 (권장)'],['skip','건너뛰기']].map(([k,l])=>h`<span class="chip ${GV.onl===k?'on':''}" data-g="onl" data-id="${k}">${l}</span>`)}</div></div>
   <div class="row"><label>안내 공지</label><input type="text" data-gi="bc" maxlength="100" value="${GV.bc}" placeholder="(선택) 지급 후 전체 공지로 보낼 문구" style="flex:1;min-width:220px"></div></div>
  <div class="box stick"><div id="gvSum"></div><div class="row"><button class="btn" id="gvGo" data-g="go">🎁 지급 시작</button><span class="hint">시작 전에 한 번 더 확인해요</span></div></div>
  <div id="gvOut"></div>`);
  gvSum()};
document.addEventListener('input',e=>{const i=e.target.closest('[data-gi]');if(!i||S.tab!=='give')return;const k=i.dataset.gi;
  if(k==='gold'||k==='xt'||k==='sf')GV[k]=Math.max(0,Math.floor(+i.value||0));
  else if(k==='uids')GV.uids=i.value;else if(k==='bc')GV.bc=i.value;
  else if(k==='q'){const q=i.value.trim().toLowerCase();document.querySelectorAll('[data-g="item"]').forEach(c=>c.hidden=!!q&&!(c.dataset.n||'').toLowerCase().includes(q))}
  gvSum()});
const gvCnt=()=>{const e=$('#gvIc');if(e)e.textContent=GV.items.size+'개 선택'};
document.addEventListener('click',guard(async e=>{
  const b=e.target.closest('[data-g]');if(!b||S.tab!=='give'&&!['apply'].includes(b.dataset.g))return;e.preventDefault();
  const k=b.dataset.g,id=b.dataset.id;
  switch(k){
   case 'tgt':GV.tgt=id;b.parentElement.querySelectorAll('[data-g="tgt"]').forEach(c=>c.classList.toggle('on',c===b));$('#gvCustom').hidden=id!=='custom';gvSum();break;
   case 'flag':GV[id]=!GV[id];b.classList.toggle('on',GV[id]);gvSum();break;
   case 'onl':GV.onl=id;b.parentElement.querySelectorAll('[data-g="onl"]').forEach(c=>c.classList.toggle('on',c===b));gvSum();break;
   case 'item':if(GV.items.has(id))GV.items.delete(id);else GV.items.add(id);b.classList.toggle('on',GV.items.has(id));gvCnt();gvSum();break;
   case 'slotAll':{const ids=ITEMS_BY(id).map(i=>i.id),all=ids.every(x=>GV.items.has(x));ids.forEach(x=>all?GV.items.delete(x):GV.items.add(x));document.querySelectorAll('[data-g="item"]').forEach(c=>c.classList.toggle('on',GV.items.has(c.dataset.id)));gvCnt();gvSum();break}
   case 'itemsClear':GV.items.clear();document.querySelectorAll('[data-g="item"]').forEach(c=>c.classList.remove('on'));gvCnt();gvSum();break;
   case 'fishAdd':{const f=$('#gvFish').value,n=clamp($('#gvFishN').value,1,200);GV.fish.push([f,n]);RENDER.give();break}
   case 'fishDel':GV.fish.splice(+id,1);RENDER.give();break;
   case 'bufAdd':{const m=clamp($('#gvBufM').value,1,120);GV.buffs.push([$('#gvBuf').value,m]);RENDER.give();break}
   case 'bufDel':GV.buffs.splice(+id,1);RENDER.give();break;
   case 'cancel':GV.cancel=true;b.disabled=true;b.textContent='중단하는 중…';break;
   case 'go':await gvRun();break;
  }}));
async function pool(arr,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,arr.length)},async()=>{while(i<arr.length){const x=arr[i++];await fn(x)}}))}
async function giveOne(uid,g){
  if(GV.onl==='skip'&&isOnline(uid))return {k:'skip'};
  const [sv,mt]=await Promise.all([get('users/'+uid+'/save'),get('users/'+uid+'/meta')]);
  if(!sv)return {k:'nosave'};
  const s=normSave(sv),add={};
  if(g.gold){s.gold+=g.gold;if(g.earned)s.earned+=g.gold;add.gift=g.gold}
  if(g.xt){s.xt+=g.xt;add.giftXt=g.xt}
  if(g.sf)s.sf+=g.sf;
  if(g.sled&&!s.sled){s.sled=1;if(!s.equip.ride)s.equip.ride='sled'}
  let gi=0;for(const id of g.items){const it=IT[id];if(it&&!s.items[id]){s.items[id]=1;gi++;if(!s.equip[it.slot])s.equip[it.slot]=id}}
  if(gi)add.giftItems=gi;
  for(const [fid,n] of g.fish){const f=FB[fid];let mx=0;for(let i=0;i<n;i++){const sz=Math.round((f.min+(f.max-f.min)*Math.random())*10)/10;mx=Math.max(mx,sz);s.inv.push({id:f.id,size:sz,price:Math.max(1,Math.round(f.p*(.75+.7*((sz-f.min)/Math.max(.1,f.max-f.min)))))})}giveCodex(s,f,n,mx)}
  for(const [bk,mi] of g.buffs){s.bf=s.bf||{};s.bf[bk]=Math.max(+s.bf[bk]||0,nowT())+mi*60000}
  s.gear=gearOf(s);
  const r=await writeSave(uid,s,mt||{},'일괄 지급',{quiet:true,metaAdd:add});
  return {k:'ok',online:r.online,verified:r.ok}}
async function gvRun(){
  if(GV.run)return;const ids=gvTargets(),g=gvPlan();
  if(!ids.length||!g.any){toast('대상과 지급 내용을 확인해 주세요',true);return}
  const on=ids.filter(isOnline).length;
  if(!await typed('지급','아래 내용을 '+ids.length.toLocaleString()+'명에게 지급해요 (접속 중 '+on+'명).\n\n'+gvLines(g).join('\n')))return;
  await fresh();
  GV.run=true;GV.cancel=false;const res={ok:0,skip:0,nosave:0,online:0,bad:0,fail:[]};let done=0;const t0=Date.now();
  const draw=fin=>put($('#gvOut'),h`<div class="box"><h3>${fin?(GV.cancel?'중단됨':'완료'):h`<span class="spin"></span>지급하는 중…`}</h3><div class="prog"><i style="width:${Math.round(done/ids.length*100)}%"></i></div>
   <div class="mono">${done.toLocaleString()} / ${ids.length.toLocaleString()}명 · 성공 ${res.ok}${res.online?' (재접속 적용 '+res.online+')':''} · 건너뜀 ${res.skip} · 세이브 없음 ${res.nosave} · 실패 ${res.fail.length}${res.bad?' · 반영 확인 실패 '+res.bad:''}</div>
   ${fin?'':h`<div class="row"><button class="btn r s" data-g="cancel">중단</button><span class="hint">이 페이지를 닫지 마세요</span></div>`}
   ${res.fail.length?h`<details class="ac"><summary>실패 ${res.fail.length}건 보기</summary><div class="bd mono">${res.fail.slice(0,50).map(x=>h`<div>${x}</div>`)}</div></details>`:''}</div>`);
  draw(false);
  await pool(ids,5,async uid=>{
    if(GV.cancel)return;
    try{const r=await giveOne(uid,g);res[r.k]++;if(r.k==='ok'){if(r.online)res.online++;if(r.verified===false)res.bad++}}catch(e){res.fail.push(uid.slice(0,8)+' · '+(nickOf(uid))+' · '+(e.code||e.message))}
    done++;if(done%2===0||done===ids.length)draw(false)});
  if(g.bc&&!GV.cancel)await db.ref('config/bc').set({id:nowT(),text:g.bc.slice(0,100)}).catch(()=>{});
  log('gift','',(gvLines(g).join(' / ')+' → '+res.ok+'명 (대상 '+ids.length+')').slice(0,190));
  GV.run=false;draw(true);toast('지급 완료 · 성공 '+res.ok+'명'+(res.fail.length?' · 실패 '+res.fail.length:''),!!res.fail.length)}

/* ---------- 도구 탭: 적용 방식 ---------- */
const _tl3=RENDER.tools;
RENDER.tools=()=>{_tl3();$('#view').insertAdjacentHTML('beforeend',String(h`<div class="box"><h3>저장 적용 방식 (접속 중인 유저)</h3>
  <div class="mut">접속 중인 유저는 자기 화면의 세이브를 계속 서버에 덮어써서, 그냥 저장하면 수정이 되돌려질 수 있어요. 그래서 <b>잠깐 막고 → 저장 → 적용 → 막은 것 해제</b> 순서로 처리해요.</div>
  <div class="chips" style="margin:8px 0">${[['kick','재접속 방식 (권장)'],['reload','새로고침 이벤트']].map(([k,l])=>h`<span class="chip ${applyMode()===k?'on':''}" data-g="apply" data-id="${k}">${l}</span>`)}</div>
  <div class="hint">현재 게임은 새로고침 이벤트를 받아도 데이터를 다시 읽지 못해요 (게임 코드의 <code>loadCloud()</code> 호출에 인자가 없음). 게임을 <code>loadCloud(MP.user, authSeq)</code> 로 고친 뒤에만 '새로고침'을 쓰세요.</div></div>`))};
document.addEventListener('click',e=>{const b=e.target.closest('[data-g="apply"]');if(!b)return;e.preventDefault();try{localStorage.setItem('pd-apply',b.dataset.id)}catch(x){}RENDER.tools();toast('적용 방식을 바꿨어요')});

</script>
</body>

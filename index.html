<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pa-Dack Admin</title>
<style>
:root{--bg:#0b1620;--bg2:#10222f;--cd:rgba(255,255,255,.055);--cd2:rgba(255,255,255,.1);--ln:rgba(255,255,255,.1);--tx:#eef6fa;--tx2:#8ba5b4;--ac:#ffb454;--ac2:#ff7a45;--ok:#3fd08c;--bad:#ff5a6a;--blue:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 0,#1f5a73,#08151f 70%);padding:20px}
.lbox{background:var(--bg2);border:1px solid var(--ln);border-radius:22px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
.lbox h1{margin:0 0 4px;color:var(--ac);font-size:28px}.lbox p{color:var(--tx2);margin:0 0 18px}
#lerr{color:var(--bad);min-height:20px;margin:12px 0 0;font-weight:700;word-break:keep-all}
.btn{border:0;border-radius:10px;padding:8px 13px;font-weight:800;background:linear-gradient(var(--ac),var(--ac2));color:#2a1200;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.g{background:var(--cd2);color:var(--tx)}.btn.r{background:var(--bad);color:#fff}.btn.k{background:var(--ok);color:#06281a}.btn.s{padding:5px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
#app{display:flex;height:100%}
aside{width:190px;flex:none;background:var(--bg2);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:14px 10px;gap:3px;overflow:auto}
aside .brand{font-weight:900;font-size:18px;color:var(--ac);padding:4px 10px 12px}
aside button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--tx2);font-weight:700;cursor:pointer}
aside button.on{background:var(--cd2);color:var(--tx)}
aside .me{margin-top:auto;padding:10px;color:var(--tx2);font-size:12px;word-break:break-all}
main{flex:1;min-width:0;overflow:auto;padding:22px 26px 60px}
h2{margin:0 0 16px;font-size:22px}h3{margin:18px 0 8px;font-size:15px;color:var(--tx2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}
.card small{color:var(--tx2);font-weight:700}.card b{display:block;font-size:26px;margin-top:4px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--tx2);font-size:12px;font-weight:700}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--cd)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;background:var(--cd2)}
.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:var(--ok);color:#06281a}.tag.wn{background:var(--ac);color:#2a1200}
input[type=text],input[type=number],input[type=search],select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:#10222f}
textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--tx2);font-weight:700;min-width:64px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--cd);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ok);color:#06281a;border-color:transparent}
.r0{color:#8fa3b0}.r1{color:#3fb97c}.r2{color:#4aa3ff}.r3{color:#b46bff}.r4{color:#ffb42e}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--tx2)}
#modal{position:fixed;inset:0;background:rgba(2,10,16,.72);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
#mb{background:var(--bg2);border:1px solid var(--ln);border-radius:20px;width:100%;max-width:880px;padding:20px 22px 26px;position:relative}
#mx{position:absolute;right:14px;top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#08151f;border:1px solid var(--ln);padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1}#toast.err{border-color:var(--bad);color:#ffb0b8}
.warn{border:1px solid rgba(255,90,106,.5);background:rgba(255,90,106,.08);border-radius:12px;padding:10px 12px;color:#ffc2c8;margin:8px 0}
.scroll{max-height:340px;overflow:auto}
canvas#omap{width:100%;max-width:480px;aspect-ratio:1;background:#0a1c2a;border:1px solid var(--ln);border-radius:14px}
@media(max-width:760px){#app{flex-direction:column}aside{width:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--ln)}aside .brand,aside .me{display:none}aside button{white-space:nowrap}main{padding:16px 12px 60px}}
</style>

</head>

function analyze(uid,u){
  const s=u.save||{},m=u.meta||{},fl=[];
  const gold=+s.gold||0,earned=+s.earned||0,created=m.created;
  const B=created?100000+(nowT()-created)/1000*150:null;
  if(B===null)fl.push(['created 없음(미이전)',0]);else{if(earned>B)fl.push(['누적획득이 시간 예산 초과',3]);if(gold>B)fl.push(['골드가 시간 예산 초과',3])}
  if(gold>earned+30000)fl.push(['골드가 누적획득+3만 초과',2]);
  const inv=Array.isArray(s.inv)?s.inv:Object.values(s.inv||{});let bad=0,hi=0,big=0;
  for(const it of inv){if(!it)continue;const f=FBY[it.id];if(!f){bad++;continue}if(+it.price>f.p*4+50)hi++;if(+it.size>f.max*1.45+1)big++}
  if(bad)fl.push([`인벤토리 존재하지 않는 id ${bad}개`,3]);if(hi)fl.push([`시세 초과 물고기 ${hi}마리`,3]);if(big)fl.push([`크기 초과 물고기 ${big}마리`,2]);
  if(inv.length>500)fl.push([`인벤토리 ${inv.length}마리`,1]);
  let cx=0;for(const [id,c] of Object.entries(s.codex||{})){const f=FBY[id];if(!f||(c&&+c.max>f.max*1.45+1))cx++}
  if(cx)fl.push([`도감 이상 항목 ${cx}개`,2]);
  const own=Object.keys(s.items||{}).length;
  if(own*300>earned+30000)fl.push([`장비 ${own}개 보유 대비 누적획득 부족`,2]);
  return {uid,fl,score:fl.reduce((a,b)=>a+b[1],0),gold,earned,own};
}

async function commit(msg){
  const s=U.save,uid=U.uid,t=nowT(),need=Math.max(s.gold,s.earned)+20000,want=t-Math.max(0,(need-100000)/150)*1000-3600e3;
  const cr=Math.floor(U.meta.created?Math.min(U.meta.created,want):Math.min(want,t-86400e3));
  const clean=JSON.parse(JSON.stringify(s));
  const up={};up['users/'+uid+'/save']=clean;up['users/'+uid+'/meta/created']=cr;
  const nick=(s.nick||'낚시꾼').slice(0,24);
  up['profiles/'+uid+'/nick']=nick;up['profiles/'+uid+'/avatar']=s.avatar;
  up['leaderboard/'+uid]={nick,avatar:s.avatar,earned:s.earned,dex:Object.keys(s.codex).length};
  await db.ref().update(up);
  U.meta.created=cr;U.has=true;S.profiles[uid]={nick,avatar:s.avatar};S.lb[uid]=up['leaderboard/'+uid];
  if(isOnline(uid))await sendEvent(uid,'reload');
  log('save',uid,msg);toast((msg||'저장')+' 완료'+(isOnline(uid)?' · 접속 중이라 즉시 반영 요청':''));renderUser();
}

   case 'itNone':ITEMDB.filter(i=>i[1]===id).forEach(i=>{delete s.items[i[0]];if(s.equip[id]===i[0])s.equip[id]=''});await commit(SLOTN[id]+' 전부 회수');break;
   case 'pitySave':document.querySelectorAll('[data-pity]').forEach(i=>s.pity[i.dataset.pity]=clamp(i.value,0,100));await commit('천장 수정');break;
   case 'fAdd':{const f=FBY[$('#fAddId').value],n=clamp($('#fAddN').value,1,200);for(let i=0;i<n;i++)s.inv.push({id:f.id,size:Math.round((f.min+(f.max-f.min)*Math.random())*10)/10,price:Math.min(60000,Math.round(f.p*1.1))});await commit(f.n+' ×'+n+' 지급');break}
   case 'invDel':s.inv.splice(+id,1);await commit('물고기 삭제');break;
   case 'invClear':if(confirm('인벤토리를 모두 비울까요?')){s.inv=[];await commit('인벤토리 비움')}break;
   case 'cxAll':Object.values(FBY).forEach(f=>{if(!s.codex[f.id])s.codex[f.id]={n:1,max:f.min,seen:true}});await commit('도감 전부 해금');break;
   case 'cxClear':if(confirm('도감을 초기화할까요?')){s.codex={};await commit('도감 초기화')}break;
   case 'uReset':if(confirm('이 유저의 세이브를 초기화할까요? (닉네임/아바타 유지)')){U.save=newDefault(s);await commit('세이브 초기화')}break;
   case 'uWipe':if(confirm('이 유저의 모든 데이터를 삭제할까요? 되돌릴 수 없어요.')&&confirm('정말 삭제합니다.')){const u=U.uid,up={};['users/'+u,'profiles/'+u,'leaderboard/'+u,'events/'+u,'world/main/players/'+u].forEach(p=>up[p]=null);await db.ref().update(up);delete S.profiles[u];delete S.lb[u];log('wipe',u,'');toast('삭제했어요');$('#modal').hidden=true;U=null;go(S.tab)}break;
   case 'uRawSave':{let o;try{o=JSON.parse($('#uRaw').value)}catch(x){toast('JSON 형식 오류',true);break}U.save=normSave(o);await commit('JSON 적용');break}
   case 'ban':await doBan(id);if(U&&U.uid===id)renderUser();if(S.tab==='bans'||S.tab==='scan')go(S.tab);break;
   case 'unban':await db.ref('bans/'+id).remove();delete S.bans[id];log('unban',id,'');toast('밴 해제');if(U&&U.uid===id)renderUser();if(S.tab==='bans')renderBans();break;
   case 'kick':await sendEvent(id,'kick').catch(()=>{});await db.ref('world/main/players/'+id).remove();log('kick',id,'');toast('추방했어요');break;
   case 'msg':{const m=prompt('보낼 메시지 (120자)');if(!m)break;await sendEvent(id,'msg',m);log('msg',id,m);toast('보냈어요');break}
   /* 랭킹 */
   case 'lbDel':await db.ref('leaderboard/'+id).remove();delete S.lb[id];log('lbDel',id,'');renderRank();break;
   case 'lbClear':if(confirm('랭킹 전체를 삭제할까요?')){await db.ref('leaderboard').remove();S.lb={};log('lbClear','','');renderRank()}break;
   /* 스캔 */
   case 'scanRun':{b.disabled=true;b.textContent='스캔 중…';const users=(await get('users'))||{};const list=[];let nomig=0;
     for(const [uid,u] of Object.entries(users)){const r=analyze(uid,u);if(!(u.meta&&u.meta.created))nomig++;if(r.score>0)list.push(r)}
     list.sort((a,b)=>b.score-a.score);S.scan={t:nowT(),total:Object.keys(users).length,nomig,list};renderScan();break}
   /* 설정 */
   case 'bcSend':{const t=$('#bcT').value.trim();if(!t)break;await db.ref('config/bc').set({id:nowT(),text:t.slice(0,100)});log('broadcast','',t);toast('공지를 보냈어요');renderCfg();break}
   case 'foAdd':{const m=+$('#foM').value;if(!(m>0)){toast('배율을 확인해 주세요',true);break}await db.ref('config/fish/'+$('#foId').value).set(m);log('fishMult',$('#foId').value,m);renderCfg();break}
   case 'foDel':await db.ref('config/fish/'+id).remove();renderCfg();break;
   case 'cfSave':{const p=+$('#cfPrice').value||1,l=+$('#cfLuck').value||0,bt=+$('#cfBite').value||1;
     await db.ref('config').update({price:p,luck:l,bite:bt,maintenance:{on:$('#mtOn').checked,msg:$('#mtMsg').value.slice(0,120)}});log('config','',`price ${p} luck ${l} bite ${bt} maint ${$('#mtOn').checked}`);toast('설정을 저장했어요');break}
   /* 피드 */
   case 'feedDel':await db.ref('feed/'+id).remove();renderFeed();break;
   case 'feedClear':if(confirm('피드를 모두 삭제할까요?')){await db.ref('feed').remove();renderFeed()}break;
   /* DB */
   case 'dbRead':{const p=$('#dbP').value.trim().replace(/^\/+|\/+$/g,'');if(!p&&!confirm('루트 전체를 읽으면 매우 클 수 있어요. 계속할까요?'))break;const v=await get(p);$('#dbT').value=JSON.stringify(v,null,2);break}
   case 'dbWrite':{const p=$('#dbP').value.trim().replace(/^\/+|\/+$/g,'');if(!p){toast('루트에는 쓸 수 없어요',true);break}let v;try{v=JSON.parse($('#dbT').value)}catch(x){toast('JSON 형식 오류',true);break}if(!confirm(p+' 에 덮어쓸까요?'))break;await db.ref(p).set(v);log('dbSet',p,'');toast('저장했어요');break}
   case 'dbDel':{const p=$('#dbP').value.trim().replace(/^\/+|\/+$/g,'');if(!p){toast('루트는 삭제할 수 없어요',true);break}if(!confirm(p+' 를 삭제할까요?'))break;await db.ref(p).remove();log('dbDel',p,'');toast('삭제했어요');break}
   /* 도구 */
   case 'backup':{const o={};for(const k of ['users','profiles','leaderboard','bans','config'])o[k]=await get(k);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='padack-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';a.click();log('backup','','');break}
   case 'migrate':{if(!confirm('created 가 없는 유저를 마이그레이션할까요?'))break;const users=(await get('users'))||{},up={},t=nowT();let n=0;
     for(const [uid,u] of Object.entries(users)){if(u.meta&&u.meta.created)continue;const s=u.save||{},need=Math.max(+s.gold||0,+s.earned||0)+50000,el=Math.max(86400,(need-100000)/150);up['users/'+uid+'/meta/created']=Math.floor(t-el*1000);n++}
     if(n)await db.ref().update(up);log('migrate','',n+'명');toast(n+'명 마이그레이션 완료');break}
   case 'ghosts':{const pl=(await get('world/main/players'))||{},up={};let n=0;for(const [k,o] of Object.entries(pl)){if(!o||!o.t||nowT()-o.t>90000){up['world/main/players/'+k]=null;n++}}if(n)await db.ref().update(up);toast(n+'명 정리');break}
   case 'evClear':if(confirm('모든 유저의 이벤트 큐를 비울까요?')){await db.ref('events').remove();toast('비웠어요')}break;
   case 'lbRebuild':{if(!confirm('모든 유저 세이브 기준으로 랭킹을 다시 만들까요?'))break;const users=(await get('users'))||{},prof=(await get('profiles'))||{},up={};let n=0;
     for(const [uid,u] of Object.entries(users)){const s=u.save;if(!s)continue;const nick=((prof[uid]&&prof[uid].nick)||s.nick||'낚시꾼').slice(0,24);up['leaderboard/'+uid]={nick,avatar:+s.avatar||0,earned:+s.earned||0,dex:Object.keys(s.codex||{}).length};n++}
     await db.ref('leaderboard').set(null);if(n)await db.ref().update(up);S.base=false;log('lbRebuild','',n+'명');toast(n+'명 랭킹 재구성');break}
  }
}));
document.addEventListener('change',guard(async e=>{
  const q=e.target.closest('[data-eq]');if(q&&U){U.save.equip[q.dataset.eq]=q.value;await commit('장착 변경')}
}));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.floor(+v||0)));
</script>
</body>
</html>
